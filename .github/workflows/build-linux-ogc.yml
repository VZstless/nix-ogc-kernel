name: 'Build linux-ogc kernel'
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
permissions:
  actions: read
  contents: read
jobs:
  build-linux-ogc:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 1024
          swap-size-mb: 4096
          build-mount-path: '/nix'
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build Kernel
        run: |
          nix build .#linux-ogc
